openapi: 3.1.0
info:
  title: RAIRE Foundation API
  version: 1.0.0
  description: |
    Contrato da fundação aprovada (`foundation-platform` v1.1). Cobre conta,
    sessão, catálogo, perfil, dados sensíveis e operação administrativa mínima.
    Web, pedidos, avaliações, portfólio e fairness ficam nas specs seguintes.
servers:
  - url: http://localhost:8080
    description: Desenvolvimento local
tags:
  - name: auth
  - name: account
  - name: catalog
  - name: directory
  - name: admin
  - name: health
paths:
  /v1/healthz:
    get:
      tags: [health]
      summary: Liveness
      responses:
        "200": { description: Processo vivo }
  /v1/readyz:
    get:
      tags: [health]
      summary: Readiness do banco e migrations
      responses:
        "200": { description: Pronto }
        "503": { description: Banco indisponível ou sem migrations }
  /v1/auth/signup:
    post:
      tags: [auth]
      summary: Cria conta e registra consentimentos versionados
      description: |
        Resposta é sempre `202 {"status":"ok"}`, inclusive para e-mail existente,
        para não enumerar contas. Em dev/teste, o token de confirmação de uma
        conta nova vai no header `X-Dev-Confirm-Token`; em produção, por e-mail.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, display_name, accept_terms, accept_privacy]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 10, maxLength: 128 }
                display_name: { type: string, minLength: 2, maxLength: 80 }
                accept_terms: { type: boolean }
                accept_privacy: { type: boolean }
      responses:
        "202": { description: Resposta genérica (conta criada ou e-mail já existente) }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/auth/login:
    post:
      tags: [auth]
      summary: Autentica e cria sessão com cookie e CSRF
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                mfa_code: { type: string, description: "Obrigatório para operator/admin." }
      responses:
        "200":
          description: Sessão criada
          content:
            application/json:
              schema:
                type: object
                properties:
                  account: { $ref: "#/components/schemas/Account" }
                  csrf_token: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoga a sessão atual
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRF"
      responses:
        "204": { description: Sessão revogada }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/auth/confirm-email:
    post:
      tags: [auth]
      summary: Confirma e-mail com token de uso único
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "204": { description: E-mail confirmado }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/auth/resend-confirmation:
    post:
      tags: [auth]
      summary: Reenvia confirmação sem revelar existência
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202": { description: Resposta genérica }
        "429": { $ref: "#/components/responses/Error" }
  /v1/auth/password-reset/request:
    post:
      tags: [auth]
      summary: Solicita reset sem revelar existência
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202": { description: Resposta genérica }
        "429": { $ref: "#/components/responses/Error" }
  /v1/auth/password-reset/confirm:
    post:
      tags: [auth]
      summary: Confirma reset e revoga todas as sessões
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { type: string, minLength: 10, maxLength: 128 }
      responses:
        "204": { description: Senha alterada }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/me:
    get:
      tags: [account]
      summary: Dados da conta autenticada
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Conta e CSRF atual
          content:
            application/json:
              schema:
                type: object
                properties:
                  account: { $ref: "#/components/schemas/Account" }
                  csrf_token: { type: string }
        "401": { $ref: "#/components/responses/Error" }
    patch:
      tags: [account]
      summary: Atualiza nome, telefone e preferência de contato
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string, minLength: 2, maxLength: 80 }
                contact_phone: { type: string, description: "Vazio remove; mudar limpa a verificação." }
                contact_preference: { type: string, enum: [platform, email, phone] }
      responses:
        "200": { description: Conta atualizada }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/me/password:
    post:
      tags: [account]
      summary: Troca de senha autenticada
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 10, maxLength: 128 }
      responses:
        "204": { description: Senha alterada; outras sessões revogadas }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/me/consents:
    get:
      tags: [account]
      summary: Lista consentimentos e versões
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Consentimentos }
        "401": { $ref: "#/components/responses/Error" }
  /v1/me/consents/{kind}/revoke:
    post:
      tags: [account]
      summary: Revoga consentimento não obrigatório
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [research, marketing] }
      responses:
        "204": { description: Revogado }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/categories:
    get:
      tags: [catalog]
      summary: Categorias ativas; suporta sinônimos
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 80 }
      responses:
        "200":
          description: Categorias
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Category" }
  /v1/categories/{slug}:
    get:
      tags: [catalog]
      summary: Categoria ativa por slug
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Categoria }
        "404": { $ref: "#/components/responses/Error" }
  /v1/professionals/me:
    get:
      tags: [directory]
      summary: Perfil do dono, com contato mascarado
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Perfil do dono }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [directory]
      summary: Cria rascunho de perfil (um por conta)
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileWrite" }
      responses:
        "201": { description: Rascunho criado }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    patch:
      tags: [directory]
      summary: Atualiza perfil e dados sensíveis
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileWrite" }
      responses:
        "200": { description: Perfil atualizado }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/professionals/me/publish:
    post:
      tags: [directory]
      summary: Publica perfil completo e com e-mail confirmado
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRF"
      responses:
        "200": { description: Publicado }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/professionals/me/pause:
    post:
      tags: [directory]
      summary: Pausa perfil publicado
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRF"
      responses:
        "200": { description: Pausado }
        "409": { $ref: "#/components/responses/Error" }
  /v1/professionals/me/resume:
    post:
      tags: [directory]
      summary: Reativa perfil pausado
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRF"
      responses:
        "200": { description: Reativado }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/professionals/{id}:
    get:
      tags: [directory]
      summary: Perfil público sem PII
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Perfil público
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile: { $ref: "#/components/schemas/PublicProfile" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/professionals/{id}/preview:
    get:
      tags: [directory]
      summary: Prévia do dono, sem PII
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Prévia }
        "404": { $ref: "#/components/responses/Error" }
  /v1/admin/categories:
    get:
      tags: [admin]
      summary: Lista categorias, inclusive inativas
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Categorias }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [admin]
      summary: Cria categoria
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                slug: { type: string }
                name: { type: string }
                description: { type: string }
                synonyms: { type: array, items: { type: string } }
                sort_order: { type: integer }
      responses:
        "201": { description: Criada }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/admin/categories/{id}:
    patch:
      tags: [admin]
      summary: Edita categoria
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                synonyms: { type: array, items: { type: string } }
                sort_order: { type: integer }
      responses:
        "200": { description: Atualizada }
        "403": { $ref: "#/components/responses/Error" }
  /v1/admin/categories/{id}/deactivate:
    post:
      tags: [admin]
      summary: Desativa categoria com auditoria
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Desativada }
        "403": { $ref: "#/components/responses/Error" }
  /v1/admin/professionals:
    get:
      tags: [admin]
      summary: Lista perfis com cursor, status e busca
      security: [{ sessionCookie: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [draft, published, paused, suspended] }
        - name: q
          in: query
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200": { description: Página de perfis }
        "403": { $ref: "#/components/responses/Error" }
  /v1/admin/professionals/{id}/suspend:
    post:
      tags: [admin]
      summary: Suspende perfil, revoga sessões e audita
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
                evidence: { type: string, maxLength: 500 }
      responses:
        "204": { description: Suspenso }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/admin/professionals/{id}/reactivate:
    post:
      tags: [admin]
      summary: Reativa perfil suspenso após validação
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Reativado }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/admin/audit-events:
    get:
      tags: [admin]
      summary: Auditoria append-only com filtros
      security: [{ sessionCookie: [] }]
      parameters:
        - name: actor
          in: query
          schema: { type: string }
        - name: target_type
          in: query
          schema: { type: string }
        - name: target_id
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200": { description: Eventos }
        "403": { $ref: "#/components/responses/Error" }
  /v1/admin/feature-flags:
    get:
      tags: [admin]
      summary: Lista feature flags
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Flags }
        "403": { $ref: "#/components/responses/Error" }
  /v1/admin/feature-flags/{key}:
    patch:
      tags: [admin]
      summary: Altera flag com auditoria; desconhecida resolve off
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - name: key
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "204": { description: Alterada }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: raire_session
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
  responses:
    Error:
      description: Erro padronizado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlation_id]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
            correlation_id: { type: string }
    Account:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        display_name: { type: string }
        role: { type: string, enum: [client, professional, operator, admin] }
        roles: { type: array, items: { type: string } }
        email_verified: { type: boolean }
        contact_email_masked: { type: string }
        contact_phone_masked: { type: string }
        contact_phone_verified: { type: boolean }
        contact_preference: { type: string, enum: [platform, email, phone] }
    Category:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        active: { type: boolean }
        sort_order: { type: integer }
        synonyms: { type: array, items: { type: string } }
    Window:
      type: object
      required: [day, start, end, timezone]
      properties:
        day: { type: integer, minimum: 0, maximum: 6 }
        start: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        end: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        timezone: { type: string }
    ProfileWrite:
      type: object
      properties:
        display_name: { type: string, minLength: 2, maxLength: 80 }
        bio: { type: string, maxLength: 500 }
        service_type: { type: string, enum: [in_person, remote, hybrid] }
        category_ids: { type: array, items: { type: string } }
        city: { type: string }
        neighborhood: { type: string }
        radius_km: { type: integer, minimum: 1, maximum: 50 }
        clear_radius: { type: boolean }
        availability:
          type: array
          items: { $ref: "#/components/schemas/Window" }
        availability_note: { type: string, maxLength: 200 }
        contact_preference: { type: string, enum: [platform, email, phone] }
        precise_lat: { type: number, minimum: -90, maximum: 90, writeOnly: true }
        precise_lng: { type: number, minimum: -180, maximum: 180, writeOnly: true }
        clear_precise_location: { type: boolean }
    PublicProfile:
      type: object
      properties:
        id: { type: string }
        display_name: { type: string }
        bio: { type: string }
        service_type: { type: string, enum: [in_person, remote, hybrid] }
        categories:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              slug: { type: string }
              name: { type: string }
        city: { type: string }
        neighborhood: { type: string }
        radius_km: { type: integer }
        availability:
          type: array
          items: { $ref: "#/components/schemas/Window" }
        availability_note: { type: string }
        verification: { type: string, enum: [unverified, contact_verified, identity_verified] }
        published_at: { type: string, format: date-time }
